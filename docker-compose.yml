name: protobuf-ai-potato

services:
  # --- gRPC chat ---
  chat:
    build: .
    image: protobuf-ai-potato-chat:local
    ports:
      - "${GRPC_PORT:-50051}:50051"
    environment:
      GRPC_ADDR: ":50051"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Browser UI for gRPC. Open http://localhost:8080
  grpcui:
    build:
      context: .
      dockerfile: Dockerfile.grpcui
    image: protobuf-ai-potato-grpcui:local
    ports:
      - "${GRPCUI_PORT:-8080}:8080"
    depends_on:
      chat:
        condition: service_healthy
    restart: unless-stopped

  # --- CRM (Twenty) + merch store ---
  postgres:
    image: twentycrm/twenty-postgres:latest
    attach: false
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty
      POSTGRES_DB: twenty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    attach: false
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  change-detect:
    image: twentycrm/twenty:latest
    attach: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["yarn", "command:prod", "upgrade"]
    restart: "no"

  server:
    image: twentycrm/twenty:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      change-detect:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "${CRM_SERVER_PORT:-3000}:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz 2>/dev/null | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    image: twentycrm/twenty:latest
    attach: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    command: ["yarn", "worker:prod"]
    restart: unless-stopped

  seed:
    image: python:3.12-alpine
    depends_on:
      server:
        condition: service_healthy
    environment:
      CRM_URL: http://server:3000
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Owner}
      ADMIN_JOB_TITLE: ${ADMIN_JOB_TITLE:-Owner}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Potato Merch}
    volumes:
      - ./crm/seed.py:/seed.py:ro
      - seed-state:/state
    entrypoint: ["python3", "/seed.py"]
    restart: "no"

  store:
    build:
      context: ./store
      dockerfile: Dockerfile
    image: potato-merch-store:local
    depends_on:
      server:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "${STORE_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      PORT: ${STORE_PORT:-3001}
      CRM_URL: http://server:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  server-local-data:
  seed-state:
